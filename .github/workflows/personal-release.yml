name: Personal release

# Builds the personal sideload APK and publishes it as the latest GitHub Release, which is what the
# phone watches (Obtainium, and the app's own daily UpdateCheck). Every push to main that touches the
# Android app ships a new build; run it by hand from the Actions tab to rebuild without a change.
#
# The APK is release code installed under the `.debug` id and signed with the same key as the phone's
# existing install, so it upgrades in place with all data kept. That key never lives in git: it comes
# from the FORK_DEBUG_KEYSTORE_B64 secret (base64 of android/fork-debug.keystore), and the cert it's
# expected to produce lives in the SIGNING_SHA256 repo variable, also outside tracked source.
#   gh secret set FORK_DEBUG_KEYSTORE_B64 -R x64Eddie/noopapp < <(base64 -i android/fork-debug.keystore)
#   gh variable set SIGNING_SHA256 -R x64Eddie/noopapp --body <sha256 of the signing cert>
# Switching to a different fork/keystore only needs those two set — nothing in this file to edit.

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/personal-release.yml'
  workflow_dispatch: {}

concurrency:
  group: personal-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v5

      # Same toolchain as upstream's android.yml: the runner's preinstalled Android SDK (the
      # setup-android action stalls on an interactive license prompt).
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v5

      - name: Restore signing key
        env:
          KEYSTORE_B64: ${{ secrets.FORK_DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::FORK_DEBUG_KEYSTORE_B64 is not set; an APK signed with any other key cannot upgrade the phone's install."
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > fork-debug.keystore

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew assembleFullRelease -PpersonalRelease -PpersonalBuild=${{ github.run_number }} --console=plain

      - name: Check signing key
        # Only an APK signed with the phone install's key can upgrade it; refuse to publish anything else.
        # Fingerprint lives in the SIGNING_SHA256 repo variable, not in tracked source:
        #   gh variable set SIGNING_SHA256 -R x64Eddie/noopapp --body <sha256 of the signing cert>
        env:
          EXPECTED_SHA256: ${{ vars.SIGNING_SHA256 }}
        run: |
          if [ -z "$EXPECTED_SHA256" ]; then
            echo "::error::SIGNING_SHA256 repo variable is not set; cannot verify the built APK's signer."
            exit 1
          fi
          expected="$EXPECTED_SHA256"
          signer=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner
          actual=$("$signer" verify --print-certs app/build/outputs/apk/full/release/app-full-release.apk \
            | sed -n 's/.*certificate SHA-256 digest: //p' | head -1)
          if [ "$actual" != "$expected" ]; then
            echo "::error::APK signed with $actual, expected $expected (FORK_DEBUG_KEYSTORE_B64 holds the wrong key)."
            exit 1
          fi

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk=app/build/outputs/apk/full/release/app-full-release.apk
          name=$(grep -o '"versionName": *"[^"]*"' app/build/outputs/apk/full/release/output-metadata.json | sed 's/.*"\([^"]*\)"$/\1/')
          version=${name%-personal}
          cp "$apk" "noop-personal-$version.apk"
          git log -10 --pretty='- %s' > notes.md
          gh release create "v$version" "noop-personal-$version.apk" \
            --target "$GITHUB_SHA" --title "NOOP personal $version" --notes-file notes.md --latest

      - name: Remove signing key
        if: always()
        run: rm -f fork-debug.keystore
